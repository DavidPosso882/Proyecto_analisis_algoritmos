<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Quindío · resultados R1–R4{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --verde: #14532d;
      --verde-suave: #e8efe9;
      --fondo: #f7f7f5;
      --tarjeta: #ffffff;
      --borde: #d6d6d0;
      --texto: #1c1c1c;
      --muted: #4b5563;
      --acento: #c0392b;
      --radio: 8px;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
           color: var(--texto); background: var(--fondo); line-height: 1.55; }
    header { background: var(--verde); color: #fff; padding: .8rem 1.2rem; }
    header strong { display: block; font-size: 1rem; }
    header nav { margin-top: .35rem; display: flex; flex-wrap: wrap; gap: .2rem 1rem; }
    header nav a { color: #d9f2e0; text-decoration: none; padding: .15rem .1rem;
                   border-radius: 4px; }
    header nav a:hover { text-decoration: underline; }
    header nav a[aria-current="page"] { color: #fff; font-weight: 700;
                                        text-decoration: underline; }
    main { max-width: 1080px; margin: 0 auto; padding: 1.2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .6rem; }
    h2 { font-size: 1.2rem; margin-top: 2rem; border-bottom: 2px solid var(--verde);
         padding-bottom: .2rem; }
    h3 { font-size: 1rem; margin-bottom: .3rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; margin: 0;
            font-size: .86rem; }
    th, td { border: 1px solid var(--borde); padding: .3rem .45rem; text-align: left;
             vertical-align: top; }
    th { background: var(--verde-suave); }
    caption { text-align: left; font-weight: 600; padding: .3rem 0; }
    .nota { color: var(--muted); font-size: .85rem; margin: .2rem 0 .8rem; }
    .panel { background: var(--tarjeta); border: 1px solid var(--borde);
             border-radius: var(--radio); padding: .8rem 1rem; margin: .8rem 0; }
    .cifra { font-size: 1.25rem; font-weight: 700; }
    .cifra-pequena { font-size: 1rem; font-weight: 700; }
    .error { background: #fde8e8; border: 1px solid var(--acento); color: #7f1d1d;
             padding: .6rem .8rem; border-radius: 6px; }
    form.filtros { display: flex; flex-wrap: wrap; gap: .8rem; align-items: flex-end; }
    label { display: block; font-size: .85rem; font-weight: 600; }
    select, button { font: inherit; padding: .3rem .4rem; }
    select { max-width: 100%; border: 1px solid var(--borde); border-radius: 4px;
             background: #fff; }
    button { background: var(--verde); color: #fff; border: 0; border-radius: 4px;
             padding: .45rem 1rem; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    button.secundario { background: #fff; color: var(--verde);
                        border: 1px solid var(--verde); }
    form .panel button + button { margin-left: .5rem; }
    button:focus-visible, a:focus-visible, select:focus-visible,
    input:focus-visible, summary:focus-visible {
      outline: 3px solid #93c5fd; outline-offset: 2px;
    }
    #mapa { height: 460px; border: 1px solid var(--borde); border-radius: var(--radio); }
    .lista-atractivos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                        gap: .3rem .9rem; margin: .6rem 0; }
    .lista-atractivos label { font-weight: 400; }
    code { background: #ececea; padding: 0 .2rem; border-radius: 3px; }
    /* --- Mejora visual: tarjetas, stats y tablas colapsables --- */
    .hero { margin: 0 0 .4rem; }
    .hero p { max-width: 70ch; }
    .stats { display: flex; flex-wrap: wrap; gap: .6rem; margin: .8rem 0; }
    .stat { background: var(--tarjeta); border: 1px solid var(--borde);
            border-radius: var(--radio); padding: .5rem .9rem; min-width: 140px; }
    .stat .cifra { display: block; }
    .stat .etiqueta { font-size: .8rem; color: var(--muted); }
    .tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: .8rem; margin: 1rem 0; }
    .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde);
               border-radius: var(--radio); padding: .8rem 1rem; }
    .tarjeta h3 { margin: 0 0 .3rem; }
    .tarjeta p { margin: .3rem 0 .6rem; font-size: .9rem; color: var(--muted); }
    .tarjeta a { font-weight: 600; }
    .resultado-destacado { display: flex; flex-wrap: wrap; gap: 1.2rem;
                           align-items: baseline; }
    .tiempo-grande { font-size: 2rem; font-weight: 800; color: var(--verde); }
    .tabla-scroll { overflow-x: auto; border: 1px solid var(--borde);
                    border-radius: var(--radio); background: #fff; margin: .4rem 0 .8rem; }
    .tabla-scroll table { margin: 0; }
    details.detalle { background: var(--tarjeta); border: 1px solid var(--borde);
                      border-radius: var(--radio); padding: .6rem .9rem; margin: .8rem 0; }
    details.detalle summary { cursor: pointer; font-weight: 600; }
    details.detalle .nota { margin-bottom: .4rem; }
    .comparativa { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                   gap: .8rem; }
    .comparativa .panel { margin: 0; }
    .diferencia { background: #fef9c3; border: 1px solid #a16207; }
    .sec-nav { display: flex; flex-wrap: wrap; gap: .4rem .9rem; margin: .6rem 0 0;
               padding: 0; list-style: none; }
    .sec-nav a { font-size: .9rem; }
    img.grafica { max-width: 100%; border: 1px solid var(--borde); background: #fff;
                  border-radius: var(--radio); }
    @media (max-width: 640px) {
      #mapa { height: 320px; }
      .tiempo-grande { font-size: 1.6rem; }
    }
  </style>
  {% block estilos %}{% endblock %}
</head>
<body>
<header>
  <strong>Proyecto final · Análisis de Algoritmos · Quindío</strong>
  <nav>
    <a href="/" {% if request.path == "/" %}aria-current="page"{% endif %}>Inicio</a>
    <a href="/ruta" {% if request.path == "/ruta" %}aria-current="page"{% endif %}>Ruta origen–destino</a>
    <a href="/envolvente" {% if request.path == "/envolvente" %}aria-current="page"{% endif %}>Envolvente</a>
    <a href="/itinerario" {% if request.path == "/itinerario" %}aria-current="page"{% endif %}>Itinerario</a>
    <a href="/resultados" {% if request.path == "/resultados" %}aria-current="page"{% endif %}>Resultados R1–R4</a>
  </nav>
</header>
<main>
{% block contenido %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
